[package]
name = "vid_translate"
version = "0.0.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vid_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: WKWebView paints an opaque background unless Tauri uses the private
# transparent-background API — without this the "transparent" window is a white slab on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vosk = "0.3"
dirs = "5"
ureq = "2"
zip = "2"
ct2rs = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreAudio input capture. macOS has no public system-audio loopback API, so the mac backend
# captures from a virtual loopback *device* (BlackHole & co.) like any other input — see
# src/audio/macos.rs.
cpal = "0.15"

