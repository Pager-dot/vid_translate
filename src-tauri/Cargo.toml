[package]
name = "vid_translate"
version = "0.0.4"
license = "Apache-2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate has a second binary (bin/ja_eval.rs, the offline eval harness), which makes a
# bare `cargo run` ambiguous — and `tauri dev` runs exactly that, so without this the dev
# server fails to start with "could not determine which binary to run".
default-run = "vid_translate"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vid_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: WKWebView paints an opaque background unless Tauri uses the private
# transparent-background API — without this the "transparent" window is a white slab on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vosk = "0.3"
dirs = "5"
ureq = "2"
zip = "2"
ct2rs = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
# Microphone capture only. System audio goes through a Core Audio process tap instead (see
# src/audio/tap.rs), which cpal cannot reach: the tap's aggregate device is private, and
# cpal's API starts from device enumeration.
cpal = "0.15"
# Core Audio process taps: system-audio capture with no driver. coreaudio-sys is already in
# the tree via cpal, but naming it pins the binding contract this code depends on rather
# than inheriting whatever cpal happens to resolve.
coreaudio-sys = "0.2"
core-foundation = "0.10"
# CATapDescription is an Objective-C class, and the window's collection behavior is one
# AppKit call Tauri exposes no API for. Both already in the tree via tao.
objc2 = "0.6"
objc2-foundation = "0.3"

