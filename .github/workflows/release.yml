name: Release

# Stable releases only — this runs ONLY when you push a version tag (e.g. v0.0.1).
# Ordinary commits to main do not build or release anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: an AppImage built on 24.04 needs glibc >= 2.39
          # and won't run on older distros.
          - platform: ubuntu-22.04
          - platform: windows-latest
          # Two separate macOS runners rather than one universal build: ct2rs CMake-builds
          # CTranslate2 for the host arch only, so a `universal-apple-darwin` target would
          # fail to link. macos-14 is Apple Silicon, macos-13 is Intel.
          - platform: macos-14
            arch: aarch64
          - platform: macos-13
            arch: x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fetched at build time rather than committed (Linux/Windows vendor theirs in-tree),
      # from Vosk's universal2 macOS wheel — one 12MB x86_64+arm64 binary serving both
      # runners. The script hard-fails if the slice for the arch being built is missing.
      - name: Fetch libvosk for macOS
        if: startsWith(matrix.platform, 'macos')
        run: bash scripts/fetch-libvosk-macos.sh

      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          # Must match bundle.macOS.minimumSystemVersion. 11.0 rather than 10.15 because
          # arm64 macOS does not exist below Big Sur — a lower target is rejected outright
          # when building for Apple Silicon, and Intel Macs run 11.0 fine.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: npm run tauri build -- --bundles app

      # Tauri only codesigns when a real identity is configured, so an unsigned .app comes out
      # of the build above. Apple Silicon refuses to launch any binary without at least an
      # ad-hoc signature, and the bundle's contents changed after the linker signed the
      # executable — so sign the finished bundle here, then build the DMG around it.
      - name: Sign and package (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          bundle_dir=src-tauri/target/release/bundle/macos
          app=$(find "$bundle_dir" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::no .app bundle was produced"; exit 1; }
          echo "Signing $app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          version=$(node -p "require('./package.json').version")
          dmg="$bundle_dir/VidTranslate_${version}_${{ matrix.arch }}.dmg"
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname VidTranslate -srcfolder "$staging" -ov -format ULFO "$dmg"
          ls -lh "$dmg"

      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          # linuxdeploy/appimagetool are themselves AppImages needing FUSE, which the
          # runner lacks — make them self-extract instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # `strip` corrupts the prebuilt libvosk.so.
          NO_STRIP: 1
        run: npm run tauri build -- --bundles appimage,deb

      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          # ct2rs hardcodes the static CRT (/MT) when it CMake-builds CTranslate2, while
          # Rust defaults to the dynamic CRT (/MD) — mixing them fails with LNK2038
          # "RuntimeLibrary mismatch" → LNK1169. Statically link the CRT everywhere to
          # match (also removes the VC++ redistributable requirement for end users).
          RUSTFLAGS: -C target-feature=+crt-static
        run: npm run tauri build

      # linuxdeploy bundles the build machine's libwayland-client, but libEGL is NOT
      # bundled — so the *host's* Mesa gets force-linked against Ubuntu 22.04's old
      # wayland libs and dies with "Could not create default EGL display:
      # EGL_BAD_PARAMETER. Aborting..." on any host with newer wayland (Fedora, Arch,
      # recent Ubuntu). Drop them so the host's own copies are used.
      - name: Un-bundle host-conflicting wayland libs from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          echo "Patching $appimage"

          workdir=$(mktemp -d)
          cp "$appimage" "$workdir/in.AppImage"
          (cd "$workdir" && ./in.AppImage --appimage-extract >/dev/null)

          for lib in libwayland-client.so.0 libwayland-egl.so.1 \
                     libwayland-cursor.so.0 libwayland-server.so.0; do
            rm -fv "$workdir/squashfs-root/usr/lib/$lib"
          done

          curl -sSfL -o "$workdir/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$workdir/appimagetool"
          "$workdir/appimagetool" "$workdir/squashfs-root" "$appimage"
          chmod +x "$appimage"
          echo "Repacked: $(ls -lh "$appimage" | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.dmg

  # Single release job: both platforms' bundles land on ONE draft release. (Two
  # concurrent jobs each creating a draft would produce duplicate drafts, since a
  # draft has no tag to look up.)
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lhR dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'VidTranslate ${{ github.ref_name }}'
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/**/*
          body: |
            Download the installer for your platform below.

            - **Linux** — `.AppImage` (`chmod +x` it, then run) or `.deb`
            - **Windows** — `.msi` or `-setup.exe`
            - **macOS** — `.dmg` (`aarch64` for Apple Silicon, `x86_64` for Intel)

            Speech models are downloaded from within the app on first use.

            **macOS notes** — the build is ad-hoc signed, not notarized, so Gatekeeper blocks
            it on first launch: right-click the app → **Open**, or run
            `xattr -dr com.apple.quarantine /Applications/vid_translate.app`.
            macOS also has no system-audio API, so capturing what your Mac plays needs a free
            loopback driver — the app links to [BlackHole](https://existential.audio/blackhole/)
            and walks you through it on first run.
