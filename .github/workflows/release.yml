name: Release

# Stable releases only — this runs ONLY when you push a version tag (e.g. v0.0.1).
# Ordinary commits to main do not build or release anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: an AppImage built on 24.04 needs glibc >= 2.39
          # and won't run on older distros.
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundler's own tools (linuxdeploy/appimagetool) are AppImages that need
          # FUSE to mount; GitHub runners have none, so make them self-extract instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # `strip` corrupts the prebuilt libvosk.so — skip it.
          NO_STRIP: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VidTranslate ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            - **Linux** — `.AppImage` (`chmod +x` it, then run) or `.deb`
            - **Windows** — `.msi` or `-setup.exe`

            Speech models are downloaded from within the app on first use.
          # Draft: the build uploads the bundles, then you review and click Publish.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
