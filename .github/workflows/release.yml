name: Release

# Stable releases only — this runs ONLY when you push a version tag (e.g. v0.0.1).
# Ordinary commits to main do not build or release anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: an AppImage built on 24.04 needs glibc >= 2.39
          # and won't run on older distros.
          - platform: ubuntu-22.04
          - platform: windows-latest
          # Apple Silicon only — one arm64 DMG covers every M-series Mac (M1…M4, incl.
          # Pro/Max/Ultra). Intel is deliberately not built.
          #
          # This stays a per-arch job rather than a universal build because ct2rs
          # CMake-builds CTranslate2 for the host arch only, so a `universal-apple-darwin`
          # target would fail to link. macos-14 is the Apple Silicon image.
          - platform: macos-14
            arch: aarch64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            squashfs-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fetched at build time rather than committed (Linux/Windows vendor theirs in-tree),
      # from Vosk's universal2 macOS wheel — one 12MB x86_64+arm64 binary serving both
      # runners. The script hard-fails if the slice for the arch being built is missing.
      - name: Fetch libvosk for macOS
        if: startsWith(matrix.platform, 'macos')
        run: bash scripts/fetch-libvosk-macos.sh

      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          # Updater artifacts are signed with minisign, and signing is mandatory —
          # `bundle.createUpdaterArtifacts` fails the build without these. That is the
          # behaviour we want: a release that cannot be signed must not ship at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Must match bundle.macOS.minimumSystemVersion and Info.plist's
          # LSMinimumSystemVersion. 14.4 is where Core Audio process taps became dependable,
          # and system-audio capture is the whole point of the app — below that there is no
          # driverless way to hear what the Mac is playing.
          MACOSX_DEPLOYMENT_TARGET: '14.4'
        run: npm run tauri build -- --bundles app

      # Tauri only codesigns when a real identity is configured, so an unsigned .app comes out
      # of the build above. Apple Silicon refuses to launch any binary without at least an
      # ad-hoc signature, and the bundle's contents changed after the linker signed the
      # executable — so sign the finished bundle here, then build the DMG around it.
      - name: Sign and package (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_dir=src-tauri/target/release/bundle/macos
          app=$(find "$bundle_dir" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::no .app bundle was produced"; exit 1; }
          echo "Signing $app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # The bundler already wrote a .app.tar.gz, but it wrapped the app as it was
          # BEFORE the codesign above — shipping that through the updater would hand users
          # an unsigned bundle Apple Silicon refuses to launch. Rebuild the tarball around
          # the signed app and re-sign it for the updater.
          rm -f "$bundle_dir"/*.app.tar.gz "$bundle_dir"/*.app.tar.gz.sig
          tar -C "$bundle_dir" -czf "$bundle_dir/$(basename "$app").tar.gz" "$(basename "$app")"
          npx tauri signer sign "$bundle_dir/$(basename "$app").tar.gz"
          ls -lh "$bundle_dir"/*.app.tar.gz*

          version=$(node -p "require('./package.json').version")
          dmg="$bundle_dir/VidTranslate_${version}_${{ matrix.arch }}.dmg"
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname VidTranslate -srcfolder "$staging" -ov -format ULFO "$dmg"
          ls -lh "$dmg"

      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          # Updater artifacts are signed with minisign, and signing is mandatory —
          # `bundle.createUpdaterArtifacts` fails the build without these. That is the
          # behaviour we want: a release that cannot be signed must not ship at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy/appimagetool are themselves AppImages needing FUSE, which the
          # runner lacks — make them self-extract instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # `strip` corrupts the prebuilt libvosk.so.
          NO_STRIP: 1
        run: npm run tauri build -- --bundles appimage,deb

      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          # Updater artifacts are signed with minisign, and signing is mandatory —
          # `bundle.createUpdaterArtifacts` fails the build without these. That is the
          # behaviour we want: a release that cannot be signed must not ship at all.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ct2rs hardcodes the static CRT (/MT) when it CMake-builds CTranslate2, while
          # Rust defaults to the dynamic CRT (/MD) — mixing them fails with LNK2038
          # "RuntimeLibrary mismatch" → LNK1169. Statically link the CRT everywhere to
          # match (also removes the VC++ redistributable requirement for end users).
          RUSTFLAGS: -C target-feature=+crt-static
        run: npm run tauri build

      # linuxdeploy bundles the build machine's libwayland-client, but libEGL is NOT
      # bundled — so the *host's* Mesa gets force-linked against Ubuntu 22.04's old
      # wayland libs and dies with "Could not create default EGL display:
      # EGL_BAD_PARAMETER. Aborting..." on any host with newer wayland (Fedora, Arch,
      # recent Ubuntu). Drop them so the host's own copies are used.
      - name: Un-bundle host-conflicting wayland libs from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          echo "Patching $appimage"

          workdir=$(mktemp -d)
          cp "$appimage" "$workdir/in.AppImage"
          (cd "$workdir" && ./in.AppImage --appimage-extract >/dev/null)

          appdir="$workdir/squashfs-root"
          # Derived, not hardcoded, so renaming productName cannot silently break this.
          app=$(basename "$(find "$appdir/usr/share/applications" -name '*.desktop' | head -1)" .desktop)
          echo "App name inside the AppDir: $app"

          # linuxdeploy writes .DirIcon as an *absolute* symlink into the build
          # directory, so it dangles everywhere but this runner (appimagetool's own
          # test rejects it: "FATAL: .DirIcon is missing"). Re-point it relatively.
          # Also repoint the root icon at the 128x128 one: linuxdeploy picks the
          # smallest (32x32), which is what the catalog would use as the thumbnail.
          rm -f "$appdir/.DirIcon" "$appdir/$app.png"
          ln -s "usr/share/icons/hicolor/128x128/apps/$app.png" "$appdir/$app.png"
          ln -s "$app.png" "$appdir/.DirIcon"

          # appimagetool is pulled from `continuous`, an unpinned moving target: the build
          # that packed v0.0.3 produced 0755 directories, a later one produced 0700, which
          # made the image unusable for any user but the one that built it (the catalog
          # runs it under firejail as another uid -> "AppRun: Permission denied"). Set the
          # modes explicitly so the result no longer depends on appimagetool's defaults.
          # linuxdeploy also leaves AppRun.wrapped at 0770, with no world-execute bit.
          chmod -R a+rX "$appdir"
          chmod 0755 "$appdir/AppRun" "$appdir/AppRun.wrapped"

          for lib in libwayland-client.so.0 libwayland-egl.so.1 \
                     libwayland-cursor.so.0 libwayland-server.so.0; do
            rm -fv "$appdir/usr/lib/$lib"
          done

          curl -sSfL -o "$workdir/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$workdir/appimagetool"
          "$workdir/appimagetool" "$appdir" "$appimage"
          chmod +x "$appimage"
          echo "Repacked: $(ls -lh "$appimage" | awk '{print $5}')"

          # Verify the finished image, so a future appimagetool that rewrites modes fails
          # the build instead of shipping. Read the modes with unsquashfs rather than
          # --appimage-extract: the runtime's extractor mkdir()s at 0700 whatever the
          # squashfs stores, so extraction cannot tell a real 0700 from its own umask.
          off=$("$appimage" --appimage-offset)
          echo "Top of the AppDir as actually stored:"
          unsquashfs -ll -max-depth 1 -o "$off" "$appimage" | sed -n '1,12p'
          bad=$(unsquashfs -ll -o "$off" "$appimage" | awk '
            $1 ~ /^d/ || ($1 ~ /^-/ && $NF ~ /\/AppRun(\.wrapped)?$/) {
              if (substr($1,8,1) != "r" || substr($1,10,1) != "x") print $1, $NF
            }')
          if [ -n "$bad" ]; then
            echo "::error::not world-traversable/executable after repack:"; echo "$bad"; exit 1
          fi

          check=$(mktemp -d)
          cp "$appimage" "$check/out.AppImage"
          (cd "$check" && ./out.AppImage --appimage-extract >/dev/null)
          [ -f "$check/squashfs-root/.DirIcon" ] || { echo "::error::.DirIcon does not resolve"; exit 1; }
          echo "AppImage checks passed: .DirIcon resolves, modes are world-readable."

      # The signature the bundler produced covers the AppImage as it came out of
      # linuxdeploy — every byte of which just changed in the repack above. Re-sign the
      # finished file, and do it AFTER the verification block so a bad repack fails the
      # build rather than shipping a correctly-signed broken image.
      - name: Re-sign the repacked AppImage for the updater
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          rm -f "$appimage".sig
          npx tauri signer sign "$appimage"
          ls -lh "$appimage" "$appimage".sig

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # Single release job: both platforms' bundles land on ONE draft release. (Two
  # concurrent jobs each creating a draft would produce duplicate drafts, since a
  # draft has no tag to look up.)
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A tag that disagrees with the version in the tree is the worst failure this
      # pipeline has: latest.json would advertise a version nothing can be downloaded for,
      # or advertise one users already have. Catch it before anything is published.
      - name: Verify the tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          want="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          cargo_v=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/[^0-9A-Za-z.+-]/,"",$3); print $3; exit}' src-tauri/Cargo.toml)
          echo "tag=$want package.json=$pkg Cargo.toml=$cargo_v"
          [ "$pkg" = "$want" ] || { echo "::error::package.json is $pkg but the tag says $want"; exit 1; }
          [ "$cargo_v" = "$want" ] || { echo "::error::src-tauri/Cargo.toml is $cargo_v but the tag says $want"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lhR dist

      # Fails the release outright if any platform's artifact or signature is missing —
      # Tauri validates the whole manifest before comparing versions, so one gap breaks
      # updates everywhere, not just on that platform.
      - name: Assemble latest.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/make-latest-json.mjs dist "${{ github.ref_name }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'VidTranslate ${{ github.ref_name }}'
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/**/*
          body: |
            Download the installer for your platform below.

            - **Linux** — `.AppImage` (`chmod +x` it, then run) or `.deb`
            - **Windows** — `.msi` or `-setup.exe`
            - **macOS** — `.dmg` (Apple Silicon, macOS 14.4+)

            Speech models are downloaded from within the app on first use.

            Once installed, VidTranslate checks for new versions itself — open
            **Settings → About** to update. (Microsoft Store and Flatpak copies are updated
            by the store instead.)

            **macOS notes** — the build is ad-hoc signed, not notarized, so Gatekeeper blocks
            it on first launch: right-click the app → **Open**, or run
            `xattr -dr com.apple.quarantine /Applications/VidTranslate.app`.
            For the same reason macOS treats each update as a different app and clears its
            audio-recording permission, so after updating you will be asked to allow it
            again under **Privacy & Security → Audio Recording**.
            macOS captures system audio through a Core Audio process tap — no driver and no
            audio routing to set up. macOS asks for permission to record audio the first time
            you start a session; it keeps working with any output device, including Bluetooth,
            and while your output is muted. Requires macOS 14.4 or later.
